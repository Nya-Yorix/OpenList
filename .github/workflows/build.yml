name: Build All

on:
  workflow_dispatch:
    inputs:
      server_version:
        description: '服务端二进制版本号 (build-all.sh)'
        required: true
        default: '5.2.0'
      app_version:
        description: 'App 版本号 (build-custom-app.sh)'
        required: true
        default: '5.2.1'

permissions:
  contents: write

jobs:
  frontend:
    name: 前端构建 (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: A-OpenList-Frontend/pnpm-lock.yaml

      - name: 构建前端
        working-directory: A-OpenList-Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 整理产物 (public/dist 布局)
        run: |
          mkdir -p web-dist
          cp -r A-OpenList-Frontend/dist/* web-dist/
          [ -d A-OpenList-Frontend/dist/static ] || cp -r A-OpenList-Frontend/public/static web-dist/static

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist/*
          if-no-files-found: error

  server:
    name: 服务端二进制 (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: windows
            keyword: windows
          - group: linux
            keyword: linux
          - group: android
            keyword: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: public/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: "构建二进制 (目标: ${{ matrix.group }})"
        run: |
          chmod +x workflow/build-all.sh
          VERSION='${{ inputs.server_version }}' WEBVERSION='${{ inputs.app_version }}' \
            ./workflow/build-all.sh '${{ matrix.keyword }}'

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.group }}
          path: dist/*.tar.gz
          if-no-files-found: error

  android-app:
    name: Android App (Flutter + gomobile)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: public/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.7
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('A-OpenList-Mobile/pubspec.lock') }}
          restore-keys: pub-cache-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/go/bin/gomobile
          key: gomobile-${{ runner.os }}-v1

      - uses: gradle/actions/setup-gradle@v4

      - name: 安装 Android NDK 27.0.12077973 与 platform 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: 安装 gomobile
        run: |
          [ -x "$HOME/go/bin/gomobile" ] || go install golang.org/x/mobile/cmd/gomobile@latest
          "$HOME/go/bin/gomobile" init

      - name: 构建 APK
        env:
          CUSTOM_SRC: ${{ github.workspace }}
          FLUTTER_BIN: ${{ github.workspace }}/.github/scripts/flutter-shim.sh
          # gomobile bind 内部会跑 go mod tidy; goproxy.cn 在 CI 上 sumdb 校验持续 GOAWAY,
          # 因此只用官方代理并关闭 sumdb 校验(完整性仍由仓库内 go.sum 保证)
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: off
        run: |
          mkdir -p .github/scripts
          cat > .github/scripts/flutter-shim.sh <<'EOF'
          #!/usr/bin/env bash
          # flutter-action 的 flutter 不在固定路径且不总在 PATH 中, 提供转发 shim
          exec "${FLUTTER_ROOT:-$RUNNER_TOOL_CACHE/flutter}/bin/flutter" "$@"
          EOF
          chmod +x .github/scripts/flutter-shim.sh
          chmod +x workflow/build-custom-app.sh
          ./workflow/build-custom-app.sh '${{ inputs.app_version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: A-OpenList-Mobile/app-build/*.apk
          if-no-files-found: error

  docker:
    name: Docker 镜像 (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [server]
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: 下载服务端二进制
        uses: actions/download-artifact@v4
        with:
          name: server-linux
          path: server-dist

      - name: 准备镜像构建上下文 (复用预编译二进制)
        run: |
          mkdir -p build/linux/${{ matrix.platform }}
          tar -xzf server-dist/openlist-linux-${{ matrix.platform }}.tar.gz \
            -C build/linux/${{ matrix.platform }}
          ls -lh build/linux/${{ matrix.platform }}/

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像 (openlist:yorix)
        run: |
          docker buildx build \
            --platform linux/${{ matrix.platform }} \
            --file Dockerfile.ci \
            --tag openlist:yorix \
            --load \
            .

      - name: 导出镜像为 tar.gz
        run: |
          docker save openlist:yorix | gzip > openlist-docker-linux-${{ matrix.platform }}.tar.gz
          ls -lh openlist-docker-linux-${{ matrix.platform }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.platform }}
          path: openlist-docker-linux-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: [server, android-app, docker]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-files

      - name: 列出产物
        run: ls -lh release-files/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.app_version }}
          name: OpenList v${{ inputs.app_version }}
          body: |
            自动构建（workflow_dispatch 触发）

            - 服务端二进制版本: ${{ inputs.server_version }}
            - App 版本: ${{ inputs.app_version }}

            产物说明:
            - `openlist-<os>-<arch>.tar.gz`: 服务端二进制（含 Windows/Linux/Android/Termux 目标）
            - `app-*-release.apk`: Android 分架构 APK（Yorix Custom Edition）
            - `openlist-docker-linux-<arch>.tar.gz`: Docker 镜像导出（openlist:yorix，amd64/arm64），导入: `docker load -i <文件>`
          files: release-files/*
          make_latest: true
